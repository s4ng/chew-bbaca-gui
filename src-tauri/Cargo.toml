[package]
name = "chewie-app"
version = "0.1.0"
description = "chewBBACA Desktop GUI"
authors = ["chew-bbaca-gui contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 는 데스크톱 바이너리와 모바일 진입점이 같은 lib 을 공유한다.
name = "chewie_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
regex = "1"
sha2 = "0.10"
# rootfs 다운로드용. 동기 API 라 별도 스레드에서 그대로 쓸 수 있다.
ureq = "2"

[features]
# 기본 Tauri 템플릿 관례 — 커스텀 프로토콜 사용 여부 전환
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
